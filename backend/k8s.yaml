# This file contains all the Kubernetes resources needed to deploy the application.
# It includes a backend, a frontend, a PostgreSQL database, and an Ingress to expose the services.
#
# Before applying this configuration, you should:
# 1. Build Docker images for your frontend and backend applications.
# 2. Push these images to a container registry (like Docker Hub, GCR, ECR).
# 3. Replace 'your-backend-image:latest' and 'your-frontend-image:latest' with your actual image names.
# 4. Review and adjust resource requests and limits as needed.
# 5. Change the default PostgreSQL password in the 'postgres-secret'.
#
# To apply this configuration:
# kubectl apply -f backend/k8s.yaml

# Namespace to isolate the application resources
apiVersion: v1
kind: Namespace
metadata:
  name: crag

---

# PersistentVolumeClaim for backend data (SQLite DB and uploads)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: crag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # Adjust storage size as needed

---

# Backend API resources

# Service to expose the backend within the cluster
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: crag
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000 # Assuming backend runs on port 8000

---

# Deployment for the backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: crag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret # IMPORTANT: Create this secret in your cluster
      containers:
        - name: backend
          # IMPORTANT: Replace with your backend Docker image
          image: ghcr.io/adrianlzt/crag-backend:main
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////data/projects.db"
            - name: UPLOAD_DIR
              value: "/data/uploads"
          volumeMounts:
            - name: backend-data
              mountPath: /data
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: backend-data-pvc

---

# Ingress to expose frontend and backend services to the outside world
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crag-ingress
  namespace: crag
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
  - host: "crag.k8s.adrianlzt.com"
    http:
      paths:
      # Route API requests to the backend service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
  tls:
    - hosts:
        - "crag.k8s.adrianlzt.com"
